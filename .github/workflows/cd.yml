name: Continuous Delivery

on:
  push:
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness

jobs:
  pack:
    name: Pack upstream DSH closure
    runs-on: ubuntu-latest
    outputs:
      dsh_tag: ${{ steps.resolve.outputs.dsh_tag }}
    steps:
      - name: Checkout dshc
        if: github.ref_type != 'tag'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve upstream version
        id: resolve
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="$(git tag --list --sort=-v:refname | head -1)"
            [ -n "$tag" ] || { echo "::error::no release tag yet — create one (git tag <version> && git push origin <version>)"; exit 1; }
          fi
          echo "dsh_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify upstream tag exists
        env:
          DSH_TAG: ${{ steps.resolve.outputs.dsh_tag }}
        run: |
          git ls-remote "https://github.com/${{ env.UPSTREAM_REPO }}.git" "refs/tags/dsh-${DSH_TAG}" | grep -q . \
            || { echo "::error::upstream tag dsh-${DSH_TAG} not found"; exit 1; }

      - name: Set up Node.js (corepack provides pnpm@11.7.0)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Checkout upstream at tag
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: refs/tags/dsh-${{ steps.resolve.outputs.dsh_tag }}
          fetch-depth: 1
          persist-credentials: false
          path: upstream

      - name: Install (frozen workspace)
        working-directory: upstream
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Build official profile
        working-directory: upstream
        run: pnpm run build:official

      - name: Pack closure (dsh family)
        working-directory: upstream
        run: pnpm run release:pack --family dsh --out dist/npm

      - name: Pack closure (vendored framework + landlock entry)
        working-directory: upstream
        run: |
          pnpm run release:pack --family vendor --out dist/npm-vendor
          pnpm --dir native/landlock-run run build:ts
          pnpm --dir native/landlock-run/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"

      - name: Verify packed install (smoke gate)
        working-directory: upstream
        run: |
          pnpm run release:verify-packed-install --family dsh \
            --from dist/npm --from dist/npm-vendor --from dist/npm-landlock

      - name: Upload closure artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dsh-closure
          path: |
            upstream/dist/npm
            upstream/dist/npm-vendor
            upstream/dist/npm-landlock
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build & push multi-arch images
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download closure tarballs
        uses: actions/download-artifact@v8
        with:
          name: dsh-closure
          path: artifacts/

      - name: Layout tarballs for the Dockerfile
        run: |
          mkdir -p dist
          for d in npm npm-vendor npm-landlock; do
            src="$(find artifacts -type d -name "$d" | head -1)"
            [ -n "$src" ] || { echo "::error::closure dir '$d' missing from artifact"; exit 1; }
            mv "$src" "dist/$d"
          done
          rm -rf artifacts
          [ "$(ls dist/npm/*.tgz 2>/dev/null | wc -l)" -ge 1 ] \
            || { echo "::error::no closure tarballs under dist/npm"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 

      - name: Regenerate closure manifest + lock from the artifacts
        run: |
          node scripts/gen-install-manifest.mjs "${{ needs.pack.outputs.dsh_tag }}"
          cd install && npm install --package-lock-only --no-audit --no-fund

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get Secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            0aebfcde-7155-47c4-ba38-b4b40019e9d2 > DOCKER_USERNAME
            d501324f-13e1-4c16-817b-b4b4001aee09 > DOCKER_PAT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PAT }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: |
            ghcr.io/hyooeewee/dshc
            godotttt/dshc
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dsh.upstream.version=${{ needs.pack.outputs.dsh_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PAT }}
          repository: godotttt/dshc
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
          enable-url-completion: true
