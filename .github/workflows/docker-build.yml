name: build-dshc

# dshc multi-arch image build (linux/amd64 + linux/arm64 -> ghcr.io/hyooeewee/dshc
# + docker.io/godotttt/dshc) from the upstream GitHub tag source (map #12):
#   job "pack"  replicates the upstream release pipeline on a native amd64
#               runner and ships the packed closure as CI artifacts;
#   job "build" regenerates the closure manifest + lock from THOSE artifacts,
#               then runs the multi-arch docker build, which only installs the
#               closure — platform-native deps resolve from the registry per
#               architecture (no full build under QEMU).
# Actions use floating majors by policy (auto-receive upstream fixes);
# bitwarden/sm-action is pinned to v3.0.1 because it publishes no floating
# v3 tag. A moving floating tag can trip the runner's digest check (observed
# digest-mismatch on docker/metadata-action@v6) — accept the risk, or pin an
# exact version when it bites.
# Tag = release: `git tag <version> && git push origin <version>` packs the
# upstream dsh-v<version> and ships <version> + `latest`; nothing under
# install/ is committed (the manifest + lock are regenerated from that run's
# artifacts). Main pushes build `latest` again from the newest release tag.
on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness

jobs:
  pack:
    name: Pack upstream DSH closure
    runs-on: ubuntu-latest
    outputs:
      dsh_tag: ${{ steps.resolve.outputs.dsh_tag }}
    steps:
      # Only needed on main pushes / dispatch (version = newest release tag);
      # tag pushes carry the version in the ref name. Tags are required for the
      # resolution, fetch them all.
      - name: Checkout dshc
        if: github.ref_type != 'tag'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve upstream version
        id: resolve
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="$(git tag --list '[0-9]*' --sort=-v:refname | head -1)"
            [ -n "$tag" ] || { echo "::error::no release tag yet — create one (git tag <version> && git push origin <version>)"; exit 1; }
          fi
          echo "dsh_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify upstream tag exists
        env:
          DSH_TAG: ${{ steps.resolve.outputs.dsh_tag }}
        run: |
          git ls-remote "https://github.com/${{ env.UPSTREAM_REPO }}.git" "refs/tags/dsh-v${DSH_TAG}" | grep -q . \
            || { echo "::error::upstream tag dsh-v${DSH_TAG} not found"; exit 1; }

      - name: Set up Node.js (corepack provides pnpm@11.7.0)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Checkout upstream at tag
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          # upstream git tag naming: dsh-v<version> (the "v" is upstream's own)
          ref: refs/tags/dsh-v${{ steps.resolve.outputs.dsh_tag }}
          fetch-depth: 1
          persist-credentials: false
          path: upstream

      - name: Install (frozen workspace)
        working-directory: upstream
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Build official profile
        working-directory: upstream
        run: pnpm run build:official

      - name: Pack closure (dsh family)
        working-directory: upstream
        run: pnpm run release:pack --family dsh --out dist/npm

      - name: Pack closure (vendored framework + landlock entry)
        working-directory: upstream
        run: |
          pnpm run release:pack --family vendor --out dist/npm-vendor
          pnpm --dir native/landlock-run run build:ts
          pnpm --dir native/landlock-run/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"

      - name: Verify packed install (smoke gate)
        working-directory: upstream
        run: |
          pnpm run release:verify-packed-install --family dsh \
            --from dist/npm --from dist/npm-vendor --from dist/npm-landlock

      - name: Upload closure artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dsh-closure
          path: |
            upstream/dist/npm
            upstream/dist/npm-vendor
            upstream/dist/npm-landlock
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build & push multi-arch images
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download closure tarballs
        uses: actions/download-artifact@v8
        with:
          name: dsh-closure
          path: artifacts/

      - name: Layout tarballs for the Dockerfile
        run: |
          mkdir -p dist
          for d in npm npm-vendor npm-landlock; do
            src="$(find artifacts -type d -name "$d" | head -1)"
            [ -n "$src" ] || { echo "::error::closure dir '$d' missing from artifact"; exit 1; }
            mv "$src" "dist/$d"
          done
          rm -rf artifacts
          [ "$(ls dist/npm/*.tgz 2>/dev/null | wc -l)" -ge 1 ] \
            || { echo "::error::no closure tarballs under dist/npm"; exit 1; }

      # Tag = release: the closure manifest + frozen lock are regenerated from
      # the artifacts packed by this very run, so no install/ update is needed
      # before tagging a new upstream version (map #12 / ticket #16).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Regenerate closure manifest + lock from the artifacts
        run: |
          node scripts/gen-install-manifest.mjs "${{ needs.pack.outputs.dsh_tag }}"
          cd install && npm install --package-lock-only --no-audit --no-fund

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get Secrets
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            0aebfcde-7155-47c4-ba38-b4b40019e9d2 > DOCKER_USERNAME
            d501324f-13e1-4c16-817b-b4b4001aee09 > DOCKER_PAT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PAT }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/hyooeewee/dshc
            godotttt/dshc
          tags: |
            type=raw,value=latest,enable={{is_default_branch || is_tag}}
            type=semver,pattern={{raw}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dsh.upstream.version=${{ needs.pack.outputs.dsh_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub has no README auto-sync for plain pushes; publish the repo
      # overview from README.md (short description + full markdown overview).
      - name: Update Docker Hub description from README
        run: |
          TOKEN="$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"username\":\"${DOCKER_USERNAME}\",\"password\":\"${DOCKER_PAT}\"}" \
            https://hub.docker.com/v2/users/login | jq -r .token)"
          BODY="$(jq -Rs --arg desc 'DeepSeek Harness Container — hardened, multi-arch, built from the upstream GitHub tag source' \
            '{description: $desc, full_description: .}' README.md)"
          curl -fsS -X PATCH -H "Authorization: JWT ${TOKEN}" -H 'Content-Type: application/json' \
            -d "$BODY" https://hub.docker.com/v2/repositories/godotttt/dshc/ | jq -r '.name // empty'