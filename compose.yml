# dshc — hardened compose defaults
# Quick start: put DEEPSEEK_API_KEY in .env (see .env.example), then
#   docker compose up -d --build
# GUI: http://127.0.0.1:${DSHC_PORT:-3080}

services:
  dshc:
    image: ghcr.io/hyooeewee/dshc:latest
    container_name: dshc
    hostname: dshc
    restart: unless-stopped

    build:
      context: .
      args:
        APT_MIRROR:
        NPM_REGISTRY:

    # --- filesystem wall ---
    read_only: true
    tmpfs:
      - /tmp

    # --- privilege wall ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - SETGID
      - SETUID
      - SETPCAP
      - NET_BIND_SERVICE
      - NET_RAW
      - SYS_CHROOT
      - MKNOD
      - AUDIT_WRITE
      - SETFCAP

    # --- resource wall ---
    pids_limit: 512
    mem_limit: 4g
    cpus: 2

    ports:
      - "127.0.0.1:${DSHC_PORT:-3080}:3080"

    volumes:
      - dshc-data:/home/dsh/.dsh
      - ./workspace:/home/dsh/workspace

    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-workspace-write}
      # First-boot seeds: entrypoint writes them into settings.yaml only while
      # that file does not exist; later GUI edits always win.
      DSHC_LOCALE: ${DSHC_LOCALE:-}
      DSHC_THEME: ${DSHC_THEME:-}
      # Privacy posture: upstream ships telemetry ON; any non-empty value
      # disables it (one-way switch — even "0"). Delete this line to enable.
      DSH_TELEMETRY_DISABLED: "1"

volumes:
  dshc-data:
